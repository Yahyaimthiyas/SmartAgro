<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>SmartAgro - Checkout</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl overflow-x-hidden">
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
<div class="flex items-center p-4 justify-between">
<div class="text-primary flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Checkout</h1>
<div class="size-10"></div>
</div>
</header>
<main class="flex-1 pb-32">
<section class="px-4 py-4">
<h2 class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight tracking-[-0.015em] mb-3">Delivery Address</h2>
<div class="flex items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl border border-primary/10 shadow-sm">
<div class="text-primary flex items-center justify-center rounded-lg bg-primary/10 shrink-0 size-12">
<span class="material-symbols-outlined">location_on</span>
</div>
<div class="flex flex-col justify-center flex-1">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold leading-normal">Farm Central</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal line-clamp-2">123 Organic Valley, Green Field Road, AG 5678</p>
</div>
<button class="flex min-w-[64px] cursor-pointer items-center justify-center rounded-lg h-8 px-3 bg-primary/10 text-primary text-sm font-semibold hover:bg-primary/20">
                        Edit
                    </button>
</div>
</section>
<section class="px-4 py-2">
<h2 class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight tracking-[-0.015em] mb-3">Order Summary</h2>
<div class="space-y-3">
<div class="flex gap-4 bg-white dark:bg-slate-800 p-3 rounded-xl border border-primary/5 shadow-sm">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16" data-alt="Bag of premium fertilizer on soil" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCc01I3nkhOKIWjleJT7pQyXswXyH6gsri-c4J6pYtFON1i9Lprvdd3kgIDB-we-0BaoiCyMUhSi0Jhh9Qx74f84jrMlPRnIkgx3n7U-awjTcdh1oDo8nxsUQPvDZXAKRBcQVnGUSnQfs-r9Rbp5C5CV836eOSLJwHuALY5NZwDGfcbooER-Qv7ZQpL7z5oAAdkjQdUHBP9QkVxn5x00fBotVcS2yCyDs4wQpaRMi74cE5tt4xL4A2HmOvQlbFchJysYjgyQiYPWwLJ");'></div>
<div class="flex flex-1 flex-col justify-center">
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Premium Fertilizer</p>
<p class="text-primary text-sm font-bold">$45.00</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">Quantity: 2</p>
</div>
</div>
<div class="flex gap-4 bg-white dark:bg-slate-800 p-3 rounded-xl border border-primary/5 shadow-sm">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16" data-alt="Bottle of organic pesticide product" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD0bEhDWuiqb1DVkiDUthzDvuiTR8Yd7z6114245rXhdY5SoMTGQSfAZvH_Gk95C6ClcGW9CmcmLrUnj4KbCOEPL8cuYlAgAhUM1BlrN-uiR2Uvw1GCnZyevekqKhy2uPxiRHfmAghojVkae1l7qMoyTyEexmUXasBc9jrm76O8ZewXhzJaDG96yCuWFQpt_2QVGLEPbEvLS9NSSfjFzRWoKV7QiQrd7wppyPweHj2zBfKeCjeZ20SaY_O8YWGteoEnCR2p4tHx9_Nn");'></div>
<div class="flex flex-1 flex-col justify-center">
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">Organic Pesticide</p>
<p class="text-primary text-sm font-bold">$28.50</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-1">Quantity: 1</p>
</div>
</div>
</div>
</section>
<section class="px-4 py-6">
<h2 class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight tracking-[-0.015em] mb-3">Payment Method</h2>
<div class="space-y-2">
<label class="flex items-center gap-3 bg-white dark:bg-slate-800 p-4 rounded-xl border border-primary/20 cursor-pointer shadow-sm">
<input checked="" class="w-5 h-5 text-primary border-primary/20 focus:ring-primary" name="payment" type="radio"/>
<span class="material-symbols-outlined text-primary">payments</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Cash on Delivery</span>
</label>
<label class="flex items-center gap-3 bg-white dark:bg-slate-800 p-4 rounded-xl border border-transparent hover:border-primary/10 cursor-pointer shadow-sm">
<input class="w-5 h-5 text-primary border-primary/20 focus:ring-primary" name="payment" type="radio"/>
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">calendar_month</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Credit (Pay Later)</span>
</label>
<label class="flex items-center gap-3 bg-white dark:bg-slate-800 p-4 rounded-xl border border-transparent hover:border-primary/10 cursor-pointer shadow-sm">
<input class="w-5 h-5 text-primary border-primary/20 focus:ring-primary" name="payment" type="radio"/>
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">account_balance_wallet</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">UPI / Digital Wallet</span>
</label>
</div>
</section>
<section class="px-4 py-2">
<div class="bg-primary/5 dark:bg-primary/10 rounded-xl p-4 space-y-2 border border-primary/10">
<div class="flex justify-between items-center">
<span class="text-slate-600 dark:text-slate-400 text-sm">Subtotal</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$118.50</span>
</div>
<div class="flex justify-between items-center">
<span class="text-slate-600 dark:text-slate-400 text-sm">GST (12%)</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">$14.22</span>
</div>
<div class="flex justify-between items-center">
<span class="text-slate-600 dark:text-slate-400 text-sm">Delivery Fee</span>
<span class="text-green-600 dark:text-green-400 font-medium">FREE</span>
</div>
<div class="pt-2 mt-2 border-t border-primary/10 flex justify-between items-center">
<span class="text-slate-900 dark:text-slate-100 font-bold">Total Amount</span>
<span class="text-primary text-xl font-bold">$132.72</span>
</div>
</div>
</section>
</main>
<footer class="fixed bottom-0 w-full max-w-md bg-white dark:bg-slate-900 p-4 border-t border-primary/10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">shopping_cart_checkout</span>
                Place Order
            </button>
</footer>
</div>
</body></html>
