<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartAgro - Add/Edit Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-4xl mx-auto flex flex-col min-h-screen pb-20">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 border-b border-primary/10">
<button class="text-slate-900 dark:text-slate-100 p-2 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-bold ml-2 flex-1">Add New Product</h1>
<button class="text-primary font-semibold px-4 py-2 hover:bg-primary/10 rounded-lg transition-colors">
                Discard
            </button>
</header>
<main class="p-4 space-y-8">
<!-- Image Upload Section -->
<section>
<h3 class="text-lg font-bold mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">image</span>
                    Product Images
                </h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<div class="aspect-square bg-primary/5 border-2 border-dashed border-primary/20 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-primary/40 transition-all">
<span class="material-symbols-outlined text-4xl text-primary/60">add_a_photo</span>
<span class="text-xs font-medium mt-2 text-primary/80">Add Photo</span>
</div>
<!-- Placeholder for existing or newly added image -->
<div class="relative group aspect-square rounded-xl overflow-hidden bg-slate-200 dark:bg-slate-800">
<img class="w-full h-full object-cover" data-alt="High quality agricultural fertilizer packaging" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD14vZK2_giaiyF55ppj2othjs8fHD2Hh5oneibvj55BI342zunkKIM9VMhxXgDFeIlwloiSgxuN3S__7T2kxbt0mZs3pil9HMZO8CTE7aYsJ2yw8bDyzHu-lm9EietxHCvDcl3KlqnkSGKC4k4meO6opr031pmqUwRbnmrIT6TerSJEG_aDSi9Zm4asC80HUceftqeTcG7NeZosuJ1ETw2izh0uhjTcbYIBJmDWE-t7rq8FyDe8PiMZ78DFbUZPFJtkorBXiLu-FDg"/>
<button class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</section>
<!-- General Information -->
<section class="space-y-4">
<h3 class="text-lg font-bold flex items-center gap-2 border-b border-primary/10 pb-2">
<span class="material-symbols-outlined text-primary">info</span>
                    General Information
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Product Name (English)</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="e.g. Organic Nitrogen Plus" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Product Name (Tamil)</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="எ.கா. ஆர்கானிக் நைட்ரஜன்" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Brand / Manufacturer</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="AgroCorp Industries" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Category</label>
<select class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary">
<option>Select Category</option>
<option>Seeds</option>
<option>Fertilizer</option>
<option>Pesticide</option>
<option>Tools</option>
</select>
</div>
<div class="flex flex-col gap-1 md:col-span-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Technical Name (Chemical Composition)</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="Urea 46% N, Phosphorus Pentoxide..." type="text"/>
</div>
</div>
</section>
<!-- Pricing & Inventory -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="space-y-4">
<h3 class="text-lg font-bold flex items-center gap-2 border-b border-primary/10 pb-2">
<span class="material-symbols-outlined text-primary">payments</span>
                        Pricing (Base)
                    </h3>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">MRP (₹)</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="0.00" type="number"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Selling Price (₹)</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<div class="space-y-4">
<h3 class="text-lg font-bold flex items-center gap-2 border-b border-primary/10 pb-2">
<span class="material-symbols-outlined text-primary">inventory_2</span>
                        Inventory
                    </h3>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Current Stock</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="Units" type="number"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400">Reorder Level</label>
<input class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="Low alert at..." type="number"/>
</div>
</div>
</div>
</section>
<!-- Usage Instructions -->
<section class="space-y-4">
<h3 class="text-lg font-bold flex items-center gap-2 border-b border-primary/10 pb-2">
<span class="material-symbols-outlined text-primary">psychology_alt</span>
                    Expert Advice &amp; Usage
                </h3>
<div class="flex flex-col gap-1">
<textarea class="bg-white dark:bg-slate-900 border-primary/20 rounded-lg focus:ring-primary focus:border-primary" placeholder="Describe dosage, application methods, and safety precautions..." rows="4"></textarea>
</div>
</section>
<!-- Variant Management -->
<section class="space-y-4">
<div class="flex items-center justify-between border-b border-primary/10 pb-2">
<h3 class="text-lg font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-primary">layers</span>
                        Variants (Sizes/Weights)
                    </h3>
<button class="flex items-center gap-1 text-sm font-bold text-primary hover:bg-primary/5 px-2 py-1 rounded">
<span class="material-symbols-outlined text-sm">add</span> Add Variant
                    </button>
</div>
<!-- Variant Rows -->
<div class="space-y-3">
<div class="grid grid-cols-12 gap-3 items-end p-3 bg-primary/5 dark:bg-primary/10 rounded-xl border border-primary/20">
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Size/Weight</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="text" value="1 kg"/>
</div>
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Price (₹)</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="number" value="450"/>
</div>
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Stock</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="number" value="24"/>
</div>
<div class="col-span-3 flex justify-end pb-1">
<button class="text-red-500 hover:bg-red-50 p-2 rounded-lg">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<div class="grid grid-cols-12 gap-3 items-end p-3 bg-primary/5 dark:bg-primary/10 rounded-xl border border-primary/20">
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Size/Weight</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="text" value="5 kg"/>
</div>
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Price (₹)</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="number" value="2100"/>
</div>
<div class="col-span-3 flex flex-col gap-1">
<label class="text-xs font-bold text-slate-500">Stock</label>
<input class="text-sm bg-white dark:bg-slate-900 border-primary/20 rounded-lg" type="number" value="10"/>
</div>
<div class="col-span-3 flex justify-end pb-1">
<button class="text-red-500 hover:bg-red-50 p-2 rounded-lg">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</div>
</section>
<!-- Danger Zone (Delete) -->
<section class="pt-8 pb-4">
<button class="flex items-center gap-2 text-red-600 font-medium hover:bg-red-50 dark:hover:bg-red-900/20 px-4 py-2 rounded-lg transition-colors">
<span class="material-symbols-outlined">delete_forever</span>
                    Delete Product
                </button>
</section>
</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-primary/10 flex gap-4 max-w-4xl mx-auto shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
<button class="flex-1 py-3 px-6 rounded-xl border-2 border-primary text-primary font-bold hover:bg-primary/5 transition-colors">
                Discard Changes
            </button>
<button class="flex-[2] py-3 px-6 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:brightness-110 active:scale-[0.98] transition-all">
                Save Product
            </button>
</footer>
</div>
</body></html>
