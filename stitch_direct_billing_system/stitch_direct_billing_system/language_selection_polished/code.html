<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartAgro - Select Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .agri-gradient {
            background: linear-gradient(180deg, rgba(236, 91, 19, 0.05) 0%, rgba(248, 246, 246, 1) 100%);
        }
        .dark .agri-gradient {
            background: linear-gradient(180deg, rgba(236, 91, 19, 0.1) 0%, rgba(34, 22, 16, 1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center px-4 py-6 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight flex-1 text-center pr-10">Select Language</h2>
</header>
<main class="flex-1 flex flex-col items-center px-6 agri-gradient">
<!-- Hero Section -->
<div class="mt-8 mb-12 text-center max-w-md">
<div class="bg-primary/10 dark:bg-primary/20 p-4 rounded-full inline-flex mb-6">
<span class="material-symbols-outlined text-primary text-4xl">language</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight mb-3">Choose your preferred language</h1>
<p class="text-slate-600 dark:text-slate-400 text-base">Select the language you want to use for the SmartAgro platform.</p>
</div>
<!-- Language Options -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-xl">
<!-- English Card -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-white dark:bg-slate-800/50 border-2 border-primary rounded-xl shadow-lg transition-all hover:scale-[1.02] active:scale-[0.98]">
<div class="absolute top-3 right-3 text-primary">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div class="mb-4 bg-slate-100 dark:bg-slate-700 p-4 rounded-full group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-4xl text-slate-700 dark:text-slate-300 group-hover:text-primary">public</span>
</div>
<span class="text-xl font-bold mb-1">English</span>
<span class="text-sm text-slate-500 dark:text-slate-400">Universal Interface</span>
</button>
<!-- Tamil Card -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-white dark:bg-slate-800/50 border-2 border-transparent hover:border-primary/50 rounded-xl shadow-sm transition-all hover:scale-[1.02] active:scale-[0.98]">
<div class="mb-4 bg-slate-100 dark:bg-slate-700 p-4 rounded-full group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-4xl text-slate-700 dark:text-slate-300 group-hover:text-primary">menu_book</span>
</div>
<span class="text-xl font-bold mb-1">தமிழ்</span>
<span class="text-sm text-slate-500 dark:text-slate-400">Tamil Language</span>
</button>
</div>
<!-- Meta info -->
<div class="mt-12 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">info</span>
                You can change this anytime in Settings.
            </p>
</div>
</main>
<!-- Footer Action -->
<footer class="p-6 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
<div class="max-w-xl mx-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 px-8 rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-lg shadow-primary/20">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
