<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">1 Litre × ₹450.00</p>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">edit</span>
</button>
<button class="p-2 text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>

</div>

<div class="flex items-center gap-2">
<button class="p-2 text-slate-400 hover:text-primary transition-colors">

<button class="w-full py-3 flex items-center justify-center gap-2 rounded-xl border-2 border-dashed border-primary/30 text-primary font-bold hover:bg-primary/5 transition-all">
<span class="material-symbols-outlined">add_circle</span>
                Add More Products
            </button>
</div>
<!-- Payment Mode -->

<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center py-3 rounded-xl border-2 border-primary bg-primary/5 text-primary">

<span class="text-xs font-medium">UPI</span>
</button>
<button class="flex flex-col items-center justify-center py-3 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-primary/50 transition-colors">

</div>
<div class="flex justify-between items-center text-slate-600 dark:text-slate-400">

<span class="text-sm font-semibold">₹474.00</span>
</div>
<div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
<span class="text-base font-bold text-slate-900 dark:text-slate-100">Total Amount</span>
<span class="text-xl font-bold text-primary">₹4,424.00</span>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-background-dark p-4 border-t border-slate-100 dark:border-slate-800 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">receipt_long</span>
                Generate &amp; Share Bill
            </button>
</div>
</div>
